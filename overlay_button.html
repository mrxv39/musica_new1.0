<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>overlay-button</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
    }

    .root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    button {
      width: 20px;
      height: 20px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.65);
      background: #3b82f6;
      color: white;
      font-size: 12px;
      font-weight: bold;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
      cursor: pointer;
      padding: 0;
      line-height: 1;
      transition: transform 120ms ease, box-shadow 120ms ease, background 120ms ease;
    }

    button:active {
      transform: scale(0.96);
    }

    button.flash {
      animation: btnFlash 220ms ease-out;
    }

    @keyframes btnFlash {
      0% {
        transform: scale(1);
        box-shadow: 0 0 10px rgba(59,130,246,0.95);
        background: #3b82f6;
      }
      35% {
        transform: scale(1.18);
        box-shadow: 0 0 22px rgba(59,130,246,1);
        background: #60a5fa;
      }
      100% {
        transform: scale(1);
        box-shadow: 0 0 8px rgba(0,0,0,0.4);
        background: #3b82f6;
      }
    }
  </style>
</head>
<body>
  <div class="root">
    <button id="btn" title="Captura manual">📸</button>
  </div>

  <script>
    function isTauriAvailable() {
      try {
        return !!window.__TAURI_INTERNALS__;
      } catch {
        return false;
      }
    }

    async function tauriInvoke(cmd, args) {
      return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
    }

    function getMesa() {
      const p = new URLSearchParams(window.location.search);
      const raw = p.get("mesa") || "1";
      const n = Number(raw);
      return Number.isFinite(n) ? n : 1;
    }

    const mesa = getMesa();
    const btn = document.getElementById("btn");

    btn?.addEventListener("click", async () => {
      if (!isTauriAvailable()) return;

      try {
        btn.classList.remove("flash");
        void btn.offsetWidth;
        btn.classList.add("flash");
        setTimeout(() => btn.classList.remove("flash"), 260);

        btn.disabled = true;
        const out = await tauriInvoke("capture_single_mesa", { mesa });
        console.log("capture_single_mesa:", out);

        const old = btn.textContent;
        btn.textContent = "✓";
        setTimeout(() => {
          btn.textContent = old;
          btn.disabled = false;
        }, 700);
      } catch (e) {
        console.error("capture_single_mesa failed", e);
        btn.textContent = "!";
        setTimeout(() => {
          btn.textContent = "📸";
          btn.disabled = false;
        }, 900);
      }
    });
  </script>
</body>
</html>
