<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>overlay-info</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }

    .root {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .pill {
      min-width: 70px;
      max-width: 120px;
      height: 22px;
      padding: 0 8px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.70);
      background: rgba(17, 24, 39, 0.65);
      color: rgba(255,255,255,0.95);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.2px;
      box-shadow: 0 0 10px rgba(0,0,0,0.45);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      user-select: none;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="root">
    <div id="pill" class="pill hidden"></div>
  </div>

  <script>
    function isTauriAvailable() {
      try {
        return !!window.__TAURI_INTERNALS__;
      } catch {
        return false;
      }
    }

    async function tauriInvoke(cmd, args) {
      return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
    }

    function getParam(name, fallback) {
      const p = new URLSearchParams(window.location.search);
      const v = (p.get(name) || "").trim();
      return v ? v : fallback;
    }

    function toNum(v) {
      if (typeof v === "number" && Number.isFinite(v)) return v;
      const s = String(v || "").trim().replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function formatBetPair(minv, maxv) {
      const a = toNum(minv);
      const b = toNum(maxv);
      if (a == null || b == null) return "";
      const fa = a % 1 === 0 ? String(a) : a.toFixed(1);
      const fb = b % 1 === 0 ? String(b) : b.toFixed(1);
      return `${fa}/${fb}`;
    }

    const mesa = Number(getParam("mesa", "1")) || 1;
    const kind = getParam("kind", "hand"); // hand | bet | move
    const pill = document.getElementById("pill");

    async function poll() {
      if (!isTauriAvailable() || !pill) return;
      try {
        const dbPath = localStorage.getItem("dbPath") || "poker_boss.db";
        const rows = await tauriInvoke("get_mesas_overlay_state", { dbPath });
        const row = Array.isArray(rows) ? rows.find(x => Number(x.mesa) === mesa) : null;

        const ready = !!row && !!row.strategy_ready;
        if (!ready) {
          pill.classList.add("hidden");
          pill.textContent = "";
          return;
        }

        let text = "";
        if (kind === "hand") {
          text = String(row.hand_class || "").trim();
        } else if (kind === "bet") {
          text = formatBetPair(row.betmin, row.betmax);
        } else if (kind === "move") {
          text = String(row.move_ || row.move || "").trim().toUpperCase();
        }

        if (!text) {
          pill.classList.add("hidden");
          pill.textContent = "";
          return;
        }

        pill.textContent = text;
        pill.classList.remove("hidden");
      } catch (e) {
        pill.classList.add("hidden");
        pill.textContent = "";
      }
    }

    setInterval(poll, 800);
    poll();
  </script>
</body>
</html>
