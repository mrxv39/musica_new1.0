<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>overlay</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: transparent;
      font-family: Arial, sans-serif;
      pointer-events: none;
    }

    .stage {
      position: relative;
      width: 2200px;
      height: 1500px;
      background: transparent;
    }

    .mesa-group {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
    }

    .pill {
      min-width: 54px;
      height: 18px;
      padding: 0 6px;
      border-radius: 4px;
      border: 1px solid rgba(255,255,255,0.65);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
      box-shadow: 0 0 8px rgba(0,0,0,0.4);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      white-space: nowrap;
      user-select: none;
      transition: opacity 150ms ease;
    }

    .pill-move {
      color: #fff;
      background: rgba(17, 24, 39, 0.75);
    }

    .pill-move.fold { background: rgba(107, 114, 128, 0.80); }
    .pill-move.raise { background: rgba(220, 38, 38, 0.85); }
    .pill-move.call { background: rgba(22, 163, 74, 0.85); }
    .pill-move.check { background: rgba(37, 99, 235, 0.85); }

    .pill-hand {
      color: #fff;
      background: rgba(17, 24, 39, 0.70);
      font-size: 10px;
    }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="stage">
    <!-- Mesa 1 -->
    <div class="mesa-group" style="left:933px; top:655px;">
      <div id="move-1" class="pill pill-move hidden"></div>
      <div id="hand-1" class="pill pill-hand hidden"></div>
    </div>
    <!-- Mesa 2 -->
    <div class="mesa-group" style="left:933px; top:1252px;">
      <div id="move-2" class="pill pill-move hidden"></div>
      <div id="hand-2" class="pill pill-hand hidden"></div>
    </div>
    <!-- Mesa 3 -->
    <div class="mesa-group" style="left:1709px; top:655px;">
      <div id="move-3" class="pill pill-move hidden"></div>
      <div id="hand-3" class="pill pill-hand hidden"></div>
    </div>
    <!-- Mesa 4 -->
    <div class="mesa-group" style="left:1709px; top:1252px;">
      <div id="move-4" class="pill pill-move hidden"></div>
      <div id="hand-4" class="pill pill-hand hidden"></div>
    </div>
  </div>

  <script>
    const FRESH_MS = 4000;

    function isTauriAvailable() {
      try {
        return !!window.__TAURI_INTERNALS__;
      } catch {
        return false;
      }
    }

    async function tauriInvoke(cmd, args) {
      return window.__TAURI_INTERNALS__.invoke(cmd, args || {});
    }

    function toNum(v) {
      if (typeof v === "number" && Number.isFinite(v)) return v;
      const s = String(v || "").trim().replace(",", ".");
      const n = Number(s);
      return Number.isFinite(n) ? n : null;
    }

    function formatMove(move, betmin, betmax) {
      const m = String(move || "").trim().toUpperCase();
      if (!m) return "";
      if (m === "FOLD") return "FOLD";
      const a = toNum(betmin);
      const b = toNum(betmax);
      if (a != null && b != null && (a > 0 || b > 0)) {
        const fa = a % 1 === 0 ? String(a) : a.toFixed(1);
        const fb = b % 1 === 0 ? String(b) : b.toFixed(1);
        return `${m} ${fa}/${fb}`;
      }
      return m;
    }

    function getMoveClass(move) {
      const m = String(move || "").trim().toLowerCase();
      if (m === "fold") return "fold";
      if (m === "raise" || m === "open" || m === "3bet" || m === "allin" || m === "push") return "raise";
      if (m === "call" || m === "limp") return "call";
      if (m === "check") return "check";
      return "";
    }

    function updateMesa(mesa, row) {
      const moveEl = document.getElementById(`move-${mesa}`);
      const handEl = document.getElementById(`hand-${mesa}`);
      if (!moveEl || !handEl) return;

      const now = Date.now();
      const ready = !!row && !!row.strategy_ready;
      const isFresh = ready &&
        typeof row.last_detected_at_ms === "number" &&
        (now - row.last_detected_at_ms) <= FRESH_MS;

      if (!isFresh) {
        moveEl.classList.add("hidden");
        moveEl.textContent = "";
        moveEl.className = "pill pill-move hidden";
        handEl.classList.add("hidden");
        handEl.textContent = "";
        return;
      }

      const move = String(row.move_ || row.move || "").trim();
      const hand = String(row.hand_class || "").trim();
      const moveText = formatMove(move, row.betmin, row.betmax);

      if (moveText) {
        moveEl.textContent = moveText;
        moveEl.className = `pill pill-move ${getMoveClass(move)}`;
        moveEl.classList.remove("hidden");
      } else {
        moveEl.classList.add("hidden");
        moveEl.textContent = "";
      }

      if (hand) {
        handEl.textContent = hand;
        handEl.classList.remove("hidden");
      } else {
        handEl.classList.add("hidden");
        handEl.textContent = "";
      }
    }

    async function poll() {
      if (!isTauriAvailable()) return;
      try {
        const dbPath = localStorage.getItem("dbPath") || "poker_boss.db";
        const rows = await tauriInvoke("get_mesas_overlay_state", { dbPath });

        for (let mesa = 1; mesa <= 4; mesa++) {
          const row = Array.isArray(rows) ? rows.find(x => Number(x.mesa) === mesa) : null;
          updateMesa(mesa, row);
        }
      } catch (e) {
        console.error("overlay poll failed", e);
      }
    }

    setInterval(poll, 800);
    poll();
  </script>
</body>
</html>
